[workspace]
members = [
  "crates/watermark-core",
  "crates/watermark-cli",
  "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.3"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
csv = "1.3"
hex = "0.4"
image = { version = "0.25", features = ["jpeg", "png", "webp", "tiff"] }
nalgebra = "0.33"
printpdf = "0.7"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
